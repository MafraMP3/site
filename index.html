<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site do Crash</title>
</head>

<style>
    #rosto-crash{
        height: 400px;
    }
    .anuncio-crash{
        height: 200px;

<body>

        <h1>Site do Crash Bandicoot</h1>

    <main>
        <div style= "text-align: center;">
            <img src="assets/crash1.png" alt="imagem-do-crash" id="rosto-crash">
        </div>
        <div>
            <img class="anuncio-crash" src="assets/crash4.jpg" alt="anuncio-velho-do-crash" id="crashbody">
            <img class="anuncio-crash" src="assets/crash5.jpg" alt="anuncio-velho-do-crash" id="crashtatto">
            <img class="anuncio-crash" src="assets/crash6.jpg" alt="anuncio-velho-do-crash" id="crashcube">
        </div>
        <div>
        <p> Mascote da Playstation, o crash marcou gerações</p>
        </div>

    <footer>
        <p> Todos os direitos reservados para Caio Mafra</p>
    </footer>
