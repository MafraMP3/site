<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site do Crash</title>
</head>

<style>
    
    
    body{
        background-color: antiquewhite;
        background-image: url(assets/crash-bandicoot-game-ivja6bwoovcuxh5g.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        color: antiquewhite;
    }
       header h1{
            font-size: 125px;
        }
        h2{
            font-size: 50px;
        }
    #rosto-crash{
        height: 400px;
    }
    .anuncio-crash{
        height: 600px;
        border: 3px;
        border-color: antiquewhite;
        border-style: solid;
    }
</style>

<body>
    <header>
        <div style= "text-align: center;">
        <h1>Site do Crash Bandicoot</h1>
       </div>
    </header>

    <main>
        <div style= "text-align: center;">
            <img src="assets/crash1.png" alt="imagem-do-crash" id="rosto-crash">
                  <h2>O mais famoso marsupial dos games</h2>
        </div>
        
        <div>
        <h3> Acervo de comerciais do crash:</h3>
        </div>
        <div style= "text-align: center;">
            <img class="anuncio-crash" src="assets/crash4.jpg" alt="anuncio-velho-do-crash" id="crashbody">
            <img class="anuncio-crash" src="assets/crash5.jpg" alt="anuncio-velho-do-crash" id="crashtatto">
            <img class="anuncio-crash" src="assets/crash6.jpg" alt="anuncio-velho-do-crash" id="crashcube">
        </div>
        <div style= "text-align: center;">
            <img class="anuncio-crash" src="assets/crash-bandicoot-1-2.jpg" alt="anuncio-velho-do-crash" id="crashmatrix">
            <img class="anuncio-crash" src="assets/the-wrath-of-cortex-1-1.jpg" alt="anuncio-velho-do-crash" id="crashaple">
        </div>
        <div  style= "text-align: center;">
            <h2>Ultimas noticias</h2>
        </div>
    </main>
    

    <footer>
        <p> Todos os direitos reservados para Caio Mafra</p>
    </footer>
</body>
</html>
